name: Job Newsletter Agent

on:
  schedule:
    # 8 AM IST (2:30 UTC)
    - cron: "30 2 * * *"
    # 8 PM IST (2:30 UTC next day)
    - cron: "30 14 * * *"

  # Manual trigger — useful for testing or forcing a profile regeneration
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Caches the sentence-transformers model (~22MB) between runs.
      # After first download, this step takes ~0s.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Resume Profile Generation ────────────────────────────────────────
      # Controlled by REGENERATE_RESUME secret:
      #   "true"  → regenerates profile from PDF (use after uploading new resume)
      #   "false" → skips if resume_profile.json already exists in repo
      #
      # How to update your resume:
      #   1. Commit new PDF to resumes/latest_resume.pdf
      #   2. Set REGENERATE_RESUME secret to "true"
      #   3. Run workflow once — profile regenerates and is committed back
      #   4. Set REGENERATE_RESUME back to "false"
      - name: Generate Resume Profile (if needed)
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          REGENERATE_RESUME:    ${{ secrets.REGENERATE_RESUME }}
          CANDIDATE_EXPERIENCE: ${{ secrets.CANDIDATE_EXPERIENCE }}
          CANDIDATE_SENIORITY:  ${{ secrets.CANDIDATE_SENIORITY }}
        run: python resume_profile.py

      # Commit back resume_profile.json if it was regenerated.
      # On normal runs (REGENERATE_RESUME=false) this is a no-op.
      - name: Commit resume_profile.json if updated
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume_profile.json
          git diff --staged --quiet || git commit -m "chore: update resume_profile.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Main Agent ───────────────────────────────────────────────────────
      - name: Run job agent
        env:
          APIFY_TOKEN:          ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          RECIPIENT_EMAIL:      ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL:         ${{ secrets.SENDER_EMAIL }}
          EMAIL_API_KEY:        ${{ secrets.EMAIL_API_KEY }}
          EMAIL_PROVIDER:       ${{ secrets.EMAIL_PROVIDER }}
          MIN_SCORE:            ${{ secrets.MIN_SCORE }}
          TOP_N:                ${{ secrets.TOP_N }}
          EMBEDDING_TOP_N:      "10"
          CANDIDATE_EXPERIENCE: ${{ secrets.CANDIDATE_EXPERIENCE }}
          CANDIDATE_SENIORITY:  ${{ secrets.CANDIDATE_SENIORITY }}
        run: python job_agent.py
