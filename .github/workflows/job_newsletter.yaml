name: Job Newsletter Agent

on:
  schedule:
    # 8 AM IST (2:30 UTC)
    - cron: "30 2 * * *"
    # 8 PM IST (2:30 UTC next day)
    - cron: "30 14 * * *"

  # Manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the sentence-transformers model between runs.
      # Without this, the 22MB model downloads on every run (~10s penalty).
      # Cache key includes the model name — update it if you change models.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Generate Resume Profile
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python resume_profile.py

      - name: Run job agent
        env:
          APIFY_TOKEN:      ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          RECIPIENT_EMAIL:  ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL:     ${{ secrets.SENDER_EMAIL }}
          EMAIL_API_KEY:    ${{ secrets.EMAIL_API_KEY }}
          EMAIL_PROVIDER:   ${{ secrets.EMAIL_PROVIDER }}
          MIN_SCORE:        ${{ secrets.MIN_SCORE }}
          TOP_N:            ${{ secrets.TOP_N }}
          EMBEDDING_TOP_N:  "10"
        run: python job_agent.py
