name: Job Newsletter Agent

on:
  schedule:
    # 6:30 AM IST
    - cron: "0 1 * * *"

    # 2:30 PM IST
    - cron: "0 9 * * *"

    # 10:30 PM IST
    - cron: "0 17 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    # Prevent overlapping runs
    concurrency:
      group: job-newsletter-agent
      cancel-in-progress: false

    steps:
      # ─────────────────────────────────────────────────────────────
      # CHECKOUT
      # ─────────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # PYTHON SETUP
      # ─────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ─────────────────────────────────────────────────────────────
      # CACHE PIP DEPENDENCIES
      # Saves GitHub Actions minutes significantly
      # ─────────────────────────────────────────────────────────────
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ─────────────────────────────────────────────────────────────
      # CACHE HUGGINGFACE MODEL
      # Prevents repeated embedding model downloads
      # ─────────────────────────────────────────────────────────────
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-all-MiniLM-L6-v2

      # ─────────────────────────────────────────────────────────────
      # INSTALL DEPENDENCIES
      # ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─────────────────────────────────────────────────────────────
      # GENERATE RESUME PROFILE (ONLY WHEN REQUIRED)
      #
      # To regenerate:
      # 1. Upload new resume PDF
      # 2. Set REGENERATE_RESUME=true in GitHub Secrets
      # 3. Run workflow once
      # 4. Set REGENERATE_RESUME=false again
      # ─────────────────────────────────────────────────────────────
      - name: Generate Resume Profile (if needed)
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          REGENERATE_RESUME:    ${{ secrets.REGENERATE_RESUME }}
          CANDIDATE_EXPERIENCE: ${{ secrets.CANDIDATE_EXPERIENCE }}
          CANDIDATE_SENIORITY:  ${{ secrets.CANDIDATE_SENIORITY }}
        run: python resume_profile.py

      # ─────────────────────────────────────────────────────────────
      # COMMIT UPDATED PROFILE
      # Only commits when resume_profile.json changes
      # ─────────────────────────────────────────────────────────────
      - name: Commit resume_profile.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add resume_profile.json

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update resume profile [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────
      # RUN MAIN JOB AGENT
      # ─────────────────────────────────────────────────────────────
      - name: Run job agent
        env:
          APIFY_TOKEN:          ${{ secrets.APIFY_TOKEN }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          RECIPIENT_EMAIL:      ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL:         ${{ secrets.SENDER_EMAIL }}
          EMAIL_API_KEY:        ${{ secrets.EMAIL_API_KEY }}
          EMAIL_PROVIDER:       ${{ secrets.EMAIL_PROVIDER }}
          MIN_SCORE:            ${{ secrets.MIN_SCORE }}
          TOP_N:                ${{ secrets.TOP_N }}
          EMBEDDING_TOP_N:      "10"
          CANDIDATE_EXPERIENCE: ${{ secrets.CANDIDATE_EXPERIENCE }}
          CANDIDATE_SENIORITY:  ${{ secrets.CANDIDATE_SENIORITY }}
        run: python job_agent.py

      # ─────────────────────────────────────────────────────────────
      # OPTIONAL DEBUG LOG UPLOAD
      # Uploads logs only if workflow fails
      # ─────────────────────────────────────────────────────────────
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: |
            *.log
            *.txt
          if-no-files-found: ignore
